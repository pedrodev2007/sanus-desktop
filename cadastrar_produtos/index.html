<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Cadastrar Produtos</title>
</head>
<body style="background-color: white;">
    <main>
        <div id="container-main">
            <div id="cadastrar-produtos-form-container">
                <form action="" method="post">
                    <input name="nome" type="text" placeholder="Nome do produto">
                    <input name="descricao" type="text" placeholder="Descrição">
                    <input name="preco" type="number" placeholder="R$ 00,00" step="0.01" min="4.99" inputmode="numeric">
                    <select name="tarja" id="tarja-combobox">
                        <option value="">Tarja</option>
                        <option value="isento">Isento</option>
                        <option value="amarela">Tarja Amarela</option>
                        <option value="vermelha">Tarja Vermelha</option>
                        <option value="preta">Tarja Preta</option>
                    </select>
                    <input type="button" value="Limpar campos">
                    <input type="submit" value="Cadastrar">
                    
                </form>
            </div> 
        </div>
    </main>


    <!--
    
    nome, descricao, preco, tarja

    -->
</body>
</html>
