<!DOCTYPE html>
<html lang="pt-BR" id="html">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Clientes</title>

  <link rel="stylesheet" href="../src/style/estiloPadrao.css">
  <link rel="stylesheet" href="../src/style/estiloComponentes.css">
  <link rel="stylesheet" href="../src/style/style.css">
  <link rel="stylesheet" href="../src/style/estiloLayout.css">
  <link rel="stylesheet" href="../src/style/estiloTexto.css">
  <link rel="stylesheet" href="../src/style/mediaQuarrys.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>

  <!-- Service / API -->
  <script src="../src/JS/Front-End/Service/apiClient.js" defer></script>

  <!--Model-->
  <script src="../src/js/Front-end/Model/modelTamanhoTexto.js" defer></script>

  <!--View-->
  <script src="../src/js/Front-End/View/renderizarConteudo.js" defer></script>
  <script src="../src/js/Front-End/View/Menus/menuOpcoes.js" defer></script>
  <script src="../src/js/Front-End/View/Menus/menuAcoes.js" defer></script>
  <script src="../src/js/Front-End/View/Menus/telaCliente.js" defer></script>
  <script src="../src/js/Front-End/View/Menus/telaConfiguracoes.js" defer></script>
  <script src="../src/js/Front-End/View/mudaTamanho.js" defer></script>
  <script src="../src/js/Front-End/View/fundoEscuro.js" defer></script>

  <!--Controller-->
  <script src="../src/JS/Front-End/Controller/clientes.js" defer></script>
  <script src="../src/js/Front-end/Controller/tamanhoTextos.js" defer></script>

  <script src="https://unpkg.com/lucide@latest" defer></script>

</head>

<body style="background-color: white;" id="body">
  <div class="pagina-principal" id="paginaPrincipal">

    <carregar-opcoes></carregar-opcoes>
    <carregar-acoes></carregar-acoes>
  </div>

  <!-- MODAL -->
  <div id="modal-cadastrar" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Cadastrar Novo Cliente</h3>
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="new-name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="new-email">
      </div>
      <div class="row gap-12">
        <div class="form-group col-5">
          <label>CPF</label>
          <input type="text" id="new-cpf" placeholder="000.000.000-00">
        </div>
        <div class="form-group col-4">
          <label>Data de Nascimento</label>
          <input type="date" id="new-birthday">
        </div>
      </div>
      <div class="row gap-12">
        <div class="form-group col-4">
          <label>Telefone</label>
          <input type="tel" id="new-telephone">
        </div>
        <div class="form-group col-6">
          <label>Senha</label>
          <input type="password" id="new-password">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="defaultCheck1">
          <label for="defaultCheck1" class="form-check-label sm">
            Deseja receber ofertas da farmácia?
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button onclick="closeModal('modal-cadastrar')" class="btn-secondary">Cancelar</button>
        <button onclick="salvarCliente()" class="btn-primary">Salvar</button>
      </div>
    </div>
  </div>
</body>

</html>
