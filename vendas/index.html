<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/style/vendas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Vendas</title>
</head>
<body style="background-color: white;">
    <main>
        <div id="container-main">
            <div id="right-side-main">
                <div id="left-side-vendas-container">
                    <div id="vendas-top">
                        <div>
                            <table id="tabelaProdutosVenda" class="table table-bordered">
                                <thead>
                                    <th>CÓDIGO DE BARRAS (VALOR NUMÉRICO)</th>
                                    <th>NOME PRODUTO</th>
                                    <th>QUANTIDADE</th>
                                    <th>LOTE</th>
                                    <th>VALOR TOTAL POR PRODUTO</th>
                                    <th>TOTAL</th>
                                </thead>
                                <tbody>
									<tr>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
									</tr>
									<tr>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
										<td>teste</td>
									</tr>
                                </tbody>
                                
                            </table>
                        </div>
                        
                    </div> <!-- TABELA -->
                    <div id="vendas-combobox-input">
                        <select class="btn-outline theme-secondary" name="formaPagamento" id="formaPagamento">
                            <option value="">FORMA DE PAGAMENTO</option>
                            <option value="dinheiro">DINHEIRO EM ESPÉCIE</option>
                            <option value="credito">CRÉDITO</option>
                            <option value="debito">DÉBITO</option>
                        </select>
                        <input id="campo_cpf" type="text" placeholder="CPF DO CLIENTE...">
                    </div> <!-- FORMA DE PAGAMENTO E CPF -->
                    <div>
                        <input id="checkBoxVendas" type="checkbox" name="checkBoxVendas">
                        <label for="checkBoxVendas">Cliente cadastrado no sistema?</label>
                    </div> <!-- CHECKBOX -->
                    <div id="vendas-final-btn">
                        <button id="btnCancelar" class="btn-outline theme-secondary">CANCELAR</button>
                        <button id="btnConfirmar" class="btn-solid theme-primary">CONFIRMAR</button>
                        
                    </div> <!-- BOTÕES -->
                </div>
                <div id="right-side-vendas-container">
                    <div id="vendas-add-remove-container">
                        <button id="btnAdicionar" class="btn-solid theme-primary">ADICIONAR</button>
                        <button id="btnRemover" class="btn-solid theme-danger">REMOVER</button>
                    </div>
                </div>
                
            </div>
        </div>
    </main>
</body>
</html>
