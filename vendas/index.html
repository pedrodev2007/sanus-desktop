<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../src/js/view/TabelaView.js"></script>
    <link rel="stylesheet" href="../src/style/vendas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Vendas</title>
</head>
<body style="background-color: white;">
    <main>
        <div id="container-main">
            <div id="right-side-main">
                <div id="left-side-vendas-container">
                    <div id="vendas-top">
                        <div>
                            <div id="tabela-container">
                                <table id="tabelaProdutosVenda" class="table table-bordered">
                                    <thead>
                                        <th>CÓDIGO DE BARRAS (VALOR NUMÉRICO)</th>
                                        <th>NOME PRODUTO</th>
                                        <th>LOTE</th>
                                        <th>VALOR POR UNIDADE</th>
                                        <th>AÇÕES</th>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <div>
                                <p><strong>TOTAL: R$ 00,00</strong> </p>
                            </div>
                        </div>
                        
                    </div> <!-- TABELA -->
                    <div id="vendas-form-container">
                        <form id="vendas-form" action="" method="post">
                            <div id="vendas-combobox-input">
                                <select class="btn-outline theme-secondary" name="formaPagamento" id="formaPagamento">
                                    <option value="">FORMA DE PAGAMENTO</option>
                                    <option value="dinheiro">DINHEIRO EM ESPÉCIE</option>
                                    <option value="credito">CRÉDITO</option>
                                    <option value="debito">DÉBITO</option>
                                </select>
                                <input name="cpf" id="campo_cpf" type="text" placeholder="CPF DO CLIENTE...">
                            </div> <!-- FORMA DE PAGAMENTO E CPF -->
                            <div>
                                <input id="checkBoxVendas" type="checkbox" name="checkBoxVendas">
                                <label for="checkBoxVendas">Cliente cadastrado no sistema?</label>
                            </div> <!-- CHECKBOX -->
                            <div id="vendas-final-btn">
                                <input id="btnLimparTudo" class="btn-outline theme-secondary" type="reset" value="LIMPAR TUDO">
                                <input id="btnLimparCampos" class="btn-outline theme-secondary" type="reset" value="LIMPAR CAMPOS">
                                <input id="btnConfirmar" class="btn-solid theme-primary" type="submit" value="CONFIRMAR">
                            </div> <!-- BOTÕES -->
                        </form>
                        
                    </div> 
                </div>
                <div id="right-side-vendas-container">
                    <div id="vendas-add-remove-container">
                        <button id="btnAdicionar" class="btn-solid theme-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
            </div>
        </div>
    </main>
</body>
</html>
